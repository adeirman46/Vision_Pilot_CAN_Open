# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
# Relative paths resolve against the build directory, which is where VisionPilot runs
# from — so this is <repo>/VisionPilot/trt_cache, already covered by .gitignore. Keep it
# off /tmp: systemd empties /tmp on every boot, taking the compiled engines with it.
engine.cache_dir    = ../trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
Lf               = 2.67    # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── Navigation (offline OSM map, drawn right of the inference view) ──────────
# Build the map first, once:  ./scripts/build_osm_map.sh     (greater Bandung)
# ── Route corridor ───────────────────────────────────────────────────────────
# Makes the vision path follow the navigation route. The route's own waypoints
# are converted into the ego frame and used to drop the AutoSteer waypoints that
# describe a branch the route does not take, before the path is fitted to them.
#
# Without it, a junction hands the path fit several branches at once and it
# returns whichever one its random sampling landed on — a different answer every
# frame, from the same road.
#
# Needs nav.enabled and a destination. With no route it stays inert.
guidance.enabled     = false
# Half-width of the corridor, metres. Sized against GPS error, not lane width:
# a 5 m fix error moves the corridor sideways by 5 m, and too tight a corridor
# then rejects the road the car is actually on.
guidance.corridor_m  = 3.0
# How far up the route to build it, metres.
guidance.lookahead_m = 60
# Below this many surviving waypoints the corridor stands down and the frame is
# fitted unfiltered. A corridor in the wrong place must never be able to starve
# the fit — the filter is only ever allowed to be as bad as no filter.
guidance.min_points  = 8

nav.enabled          = false
nav.map_file         = ../maps/bandung-roads.vpmap

# Where the position comes from:
#   phyphox   the phyphox app's "Location (GPS)" experiment — GET /get?lat&lon.
#             Open the experiment, three-dot menu -> Allow remote access, press
#             play. Needs nav.gps_url: it is its own app on its own port.
#   ipwebcam  the phone that streams the camera — GET /sensors.json?sense=gps.
#             Only works if that build of IP Webcam lists GPS under Data logging
#             -> Active data logging sources; several do not, and then the
#             endpoint answers {} forever no matter what permissions are given.
#   nucleo    the Nucleo-G474RE on USB, reading the DFRobot GNSS-RTK rover and
#             (with the gps_imu_ekf firmware) an IMU, fused on the board and
#             published as $VPFUS / $VPRTK lines. No phone involved. Uses
#             nav.gps_port; leave nav.imu_enabled off — the board already fused
#             them, and filtering a filtered position lags.
#   file      a recorded track, one "lat,lon[,speed_ms[,bearing_deg]]" per line
#   fixed     a static coordinate — exercises the map with no receiver
#   none      no position at all
nav.gps_source       = phyphox
# For ipwebcam, empty means "the origin of source.input_video" — one phone, one
# port, frames and position together. phyphox always needs it written out.
nav.gps_url          = http://172.27.74.24:8080
nav.gps_file         =
nav.gps_rate_hz      = 2.0
# For nav.gps_source = nucleo. Empty picks the first /dev/ttyACM* found, which
# is right whenever only one Nucleo is plugged in. An ST-LINK is a CDC-ACM
# device; a /dev/ttyUSB* is a USB-serial bridge and a different board.
nav.gps_port         =
nav.gps_baud         = 115200
# Bandung city centre
nav.fixed_position   = -6.9175,107.6191

# Destination for turn-by-turn guidance. Empty → free-drive map, no route.
nav.destination      =
nav.destination_name =

# Panel width in px, appended to the right of the HUD.
nav.panel_width      = 512
# Compose onto a canvas of exactly this size, so the window matches the screen
# and the toolkit never pads it with a white border. "none" = side-by-side only.
nav.output_size      = 1920x1080
# Metres covered across the panel width.
nav.zoom_m           = 400
# false = north up
nav.heading_up       = true

# Aerial imagery under the road network instead of the flat drawn land. Tiles
# are fetched once and kept in nav.tile_cache_dir, so a road driven once needs
# no network the next time; with no tiles at all the panel falls back to the
# drawn map rather than going blank. scripts/run/inference_cam_nav_mp.sh turns
# this on, inference_cam_nav.sh leaves it off.
nav.satellite        = false
# {z}/{x}/{y} placeholders. Esri World Imagery serves z/y/x, in that order.
nav.tile_url         = https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
nav.tile_cache_dir   = ../maps/tiles
nav.tile_attribution = Imagery (c) Esri
# Deepest zoom to ask for. Esri has 19 over Bandung; asking past what a provider
# holds just fills the cache with misses.
nav.tile_max_zoom    = 19
# true = never download, draw only what is already cached
nav.tile_offline     = false
# How much of the road network to trace over the imagery: all | major | off.
# "all" is the same network the drawn map has, at the same widths — the picture
# shows where the tarmac is, these lines show where the map thinks it is, and it
# is the map the route and the speed limit come from.
nav.satellite_roads  = all
# 1.0 draws it exactly as the drawn map does; lower lets the photograph through.
nav.satellite_roads_opacity = 0.85

# Set true once the vehicle speed really comes off CAN. While false the HUD
# shows "-" instead of the synthesised constant the planner runs on.
vehicle.speed_valid = false

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080