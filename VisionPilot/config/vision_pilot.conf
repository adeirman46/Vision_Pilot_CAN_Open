# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
# Relative paths resolve against the build directory, which is where VisionPilot runs
# from — so this is <repo>/VisionPilot/trt_cache, already covered by .gitignore. Keep it
# off /tmp: systemd empties /tmp on every boot, taking the compiled engines with it.
engine.cache_dir    = ../trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
Lf               = 2.67    # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── Navigation (offline OSM map, drawn right of the inference view) ──────────
# Build the map first, once:  ./scripts/build_osm_map.sh     (greater Bandung)
nav.enabled          = false
nav.map_file         = ../maps/bandung-roads.vpmap

# Where the position comes from:
#   phyphox   the phyphox app's "Location (GPS)" experiment — GET /get?lat&lon.
#             Open the experiment, three-dot menu -> Allow remote access, press
#             play. Needs nav.gps_url: it is its own app on its own port.
#   ipwebcam  the phone that streams the camera — GET /sensors.json?sense=gps.
#             Only works if that build of IP Webcam lists GPS under Data logging
#             -> Active data logging sources; several do not, and then the
#             endpoint answers {} forever no matter what permissions are given.
#   file      a recorded track, one "lat,lon[,speed_ms[,bearing_deg]]" per line
#   fixed     a static coordinate — exercises the map with no receiver
#   none      no position at all
nav.gps_source       = phyphox
# For ipwebcam, empty means "the origin of source.input_video" — one phone, one
# port, frames and position together. phyphox always needs it written out.
nav.gps_url          = http://172.27.74.24:8080
nav.gps_file         =
nav.gps_rate_hz      = 2.0
# Bandung city centre
nav.fixed_position   = -6.9175,107.6191

# Destination for turn-by-turn guidance. Empty → free-drive map, no route.
nav.destination      =
nav.destination_name =

# Panel width in px, appended to the right of the HUD.
nav.panel_width      = 512
# Compose onto a canvas of exactly this size, so the window matches the screen
# and the toolkit never pads it with a white border. "none" = side-by-side only.
nav.output_size      = 1920x1080
# Metres covered across the panel width.
nav.zoom_m           = 400
# false = north up
nav.heading_up       = true

# Set true once the vehicle speed really comes off CAN. While false the HUD
# shows "-" instead of the synthesised constant the planner runs on.
vehicle.speed_valid = false

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080