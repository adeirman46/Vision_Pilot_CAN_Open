; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200

; DFRobot ship this Arduino-style, with no library.json, so PlatformIO takes
; it straight from git. `architectures=*` in library.properties, so there is
; no STM32 exclusion to work around.
lib_deps =
    https://github.com/DFRobot/DFRobot_RTK_LoRa.git

; newlib-nano drops float support out of printf to save flash, and without
; this `snprintf("%.7f")` emits an empty field instead of a coordinate. The
; $VPRTK sentence builder in src/gps_uart_1hz.cpp depends on it.
build_flags =
    -Wl,-u,_printf_float

