; DFRobot GNSS-RTK rover (TEL0171-LoRa) on a ST Nucleo-G474RE.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_g474re

[env]
platform  = ststm32
board     = nucleo_g474re
framework = arduino

; The ST-LINK virtual COM port. This is the link to the host PC, and the
; speed `Serial.begin()` uses in every firmware here.
monitor_speed = 115200

; DFRobot ship this Arduino-style, with no library.json, so PlatformIO takes
; it straight from git. `architectures=*` in library.properties, so there is
; no STM32 exclusion to work around.
lib_deps =
    https://github.com/DFRobot/DFRobot_RTK_LoRa.git

; newlib-nano drops float support out of printf to save flash, and without
; this `snprintf("%.7f")` emits an empty field instead of a coordinate. The
; sentence builder in main.cpp depends on it.
build_flags =
    -Wl,-u,_printf_float

; GPS only, run at 10 Hz — see `kFixHz` in 10hz_i2c/main.cpp. Still the default
; env, and the one to flash once an RTK base station is up: at centimetre accuracy
; there is something to gain from asking for ten fixes a second.
[env:nucleo_g474re]
build_src_filter = -<*> +<../10hz_i2c/main.cpp>

; Both sensors on this board, fused here: the DFRobot rover on I2C at 1 Hz and
; the Yahboom MRA02 IMU on USART1 at 25 Hz, through the same 6-state EKF the host
; runs, publishing a smoothed position at 20 Hz. This is the env to flash when
; the IMU is wired to the Nucleo rather than to the PC.
;   pio run -e gps_imu_ekf -t upload && pio device monitor
;
; SERIAL_RX_BUFFER_SIZE: the core's default is 64 bytes, and one MRA02 reading is
; four frames totalling ~66 — so a single burst of GPS register reads (~20 ms,
; once a second) would overrun it and tear a reading in half. 512 makes the
; buffer larger than anything the loop can be away for.
[env:gps_imu_ekf]
build_src_filter = -<*> +<../gps_imu_ekf/>
build_flags =
    ${env.build_flags}
    -D SERIAL_RX_BUFFER_SIZE=512

; Where is the IMU? Sweeps four candidate UART pin pairs against six baud rates
; and reports what arrives on each, repeating for ever so a wire can be moved and
; the verdict watched. This is the tool for `imu-silent`, and it separates dead
; power from an uncrossed pair from a wire in the wrong hole — three faults that
; are indistinguishable from the fused firmware's point of view.
;   pio run -e diag_imu_uart -t upload && pio device monitor
;
; It reuses the decoder from gps_imu_ekf/ rather than carrying its own copy of
; the frame format: two implementations of one protocol drift, and then the
; sniffer says the module is fine while the firmware says it is silent.
[env:diag_imu_uart]
build_src_filter = -<*> +<../diag_imu_uart/> +<../gps_imu_ekf/imu_mra02.cpp>

; The GPS half of the host's GPS/IMU filter: I2C, 1 Hz, and it does not wait for
; RTK — a standalone quality-1 fix is published with an honest accuracy_m and the
; EKF weights it accordingly. This is the env to flash while there is no base
; station running. Same $VPRTK sentences as the default env, so the host reader
; does not care which of the two is on the board.
;   pio run -e gps_1hz -t upload && pio device monitor
;
; It re-sends $PAIR050,1000 on every boot, which matters: the rate lives in the
; receiver, not in this firmware, so flashing this over a running 10 Hz session
; would otherwise leave the rover at 10 Hz until it lost power.
[env:gps_1hz]
build_src_filter = -<*> +<../gps_1hz/main.cpp>

; The previous 1 Hz firmware, kept buildable so a 10 Hz problem can be bisected
; against a known-good baseline rather than reconstructed. Untouched: it does
; not configure the rate at all, it just takes the receiver's 1 Hz default.
;   pio run -e legacy_1hz -t upload
;
; Note it does not put the rover *back* to 1 Hz. Nothing here writes flash
; (kSaveToFlash is off), so the rate resets when the rover loses power — but
; flashing this over a running 10 Hz session leaves the receiver at 10 Hz until
; then, and this build will happily publish every one of those fixes.
;
; Every firmware here lives in its own folder beside an empty src/, so that no
; two of them can drift into each other's builds. build_src_filter is relative to
; src_dir, hence the `../` in each one.
[env:legacy_1hz]
build_src_filter = -<*> +<../legacy_1hz/main.cpp>

; Hardware probe, for when the rover answers `no-device`. Sweeps every plausible
; baud rate and reports whether any bytes come back at all, which separates a
; baud mismatch from dead wiring. See 10hz_i2c/diag_baud_scan.cpp.
;   pio run -e diag -t upload && pio device monitor
[env:diag]
build_src_filter = -<*> +<../10hz_i2c/diag_baud_scan.cpp>

; Why the rover is still at 1 Hz after $PAIR050. Separates "the AT passthrough
; does not work over UART" from "the receiver refused" from "the receiver is at
; 10 Hz but DFRobot's register file only refreshes at 1 Hz". Takes ~25 s.
;   pio run -e diag_rate -t upload && pio device monitor
[env:diag_rate]
build_src_filter = -<*> +<../10hz_i2c/diag_rate.cpp>

; Why no RTCM corrections are reaching the rover — base_id=0 and corr_age=0.0
; forever. Reports the rover-side LoRa config and then watches the correction
; fields, latching whether anything has EVER arrived. Runs until unplugged, so
; you can move the base or the antennas and watch it change.
;   pio run -e diag_rtk_link -t upload && pio device monitor
[env:diag_rtk_link]
build_src_filter = -<*> +<../10hz_i2c/diag_rtk_link.cpp>
